name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Gradle tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: bash ./scripts/test-discord-release-announcement.sh
      - run: pwsh ./scripts/test-validate-optional-integrations.ps1
      - run: bash ./gradlew test jacocoTestReport
      - uses: codecov/codecov-action@v7
        # Temporarily disabled during the Codecov certificate outage; re-enable after recovery.
        if: ${{ false }}
        with:
          use_oidc: true
          fail_ci_if_error: true
