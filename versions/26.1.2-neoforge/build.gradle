plugins {
    id 'com.gradleup.shadow' version '8.3.8'
    id 'net.neoforged.moddev' version '2.0.141'
}

base {
    archivesName = 'ae2-crafting-time-26.1.2-NeoForge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

def runtimeRunDirectory = providers.gradleProperty('runtimeRunDirectory').getOrElse('run-dev')

neoForge {
    version = providers.gradleProperty('runtimeNeoForge2612Version').getOrElse('26.1.2.71')

    runs {
        client {
            client()
            jvmArgument '-Xmx8G'
            ['scenario', 'profile', 'world', 'output', 'interactive', 'advancedStatus'].each { name ->
                def property = providers.gradleProperty("testDriver${name.capitalize()}")
                if (property.isPresent()) jvmArgument "-Dae2craftingtime.test.${name}=${property.get()}"
            }
            if (providers.gradleProperty('testDriverWorld').isPresent()) {
                programArgument '--quickPlaySingleplayer'
                programArgument providers.gradleProperty('testDriverWorld').get()
            }

            // Lightning Tech uses @OnlyIn; keep diagnostics in the log without pausing client startup.
            jvmArgument '-Dneoforge.warnings.onlyin.hide=true'
        }
        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            gameDirectory = project.file(runtimeRunDirectory)
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        ae2craftingtime {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.java.srcDir '../../shared/src/main/java'
sourceSets.main.java.srcDir '../../shared/src/mcCommon/java'
sourceSets.main.java.srcDir '../../shared/src/neoforge/java'
sourceSets.main.java.srcDir '../../shared/src/mc2612/java'
sourceSets.main.resources.srcDir '../../shared/src/main/resources'

sourceSets.test.java.srcDir '../../shared/src/mc1201Test/java'
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    implementation "org.appliedenergistics:appliedenergistics2:${providers.gradleProperty('runtimeAe2NeoForge2612Version').getOrElse('26.1.10-beta')}"
    compileOnly 'org.appliedenergistics:guideme:26.1.10-alpha'
    compileOnly 'maven.modrinth:jei:21Q5T62Q'
    compileOnly 'maven.modrinth:advancedae:26.1.7'
    compileOnly 'maven.modrinth:qelfSMnn:v2PSNZ3v'
    compileOnly 'curse.maven:ae2-network-analyser-961856:8127472'
    compileOnly 'maven.modrinth:VQhDBNs8:qUOmPSfe'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            mod_id                 : 'ae2craftingtime',
            mod_name               : 'AE2 Crafting Time',
            mod_version            : project.version,
            mod_license            : 'MIT',
            mod_authors            : 'ctux',
            mod_description        : 'Shows when AE2 autocrafting should finish and helps you spot delays and bottlenecks.',
            minecraft_version_range: '[26.1.2]',
            neoforge_version_range : '[26.1.2.71,)',
            loader_version_range   : '[1,)'
    ]

    inputs.properties props

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'ae2craftingtime',
                'Specification-Vendor'    : 'ctux',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'ctux',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def distModVersion = project.version.toString()

tasks.register('distMod', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into rootProject.layout.projectDirectory.dir('dist')
    rename { "ae2-crafting-time-${distModVersion}-neoforge-26.1.2.jar" }
}

// Separate companion: never add driver sources or libraries to the player mod.
sourceSets { testDriver }
sourceSets.testDriver.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.testDriver.runtimeClasspath += sourceSets.testDriver.output + sourceSets.testDriver.compileClasspath
sourceSets.test.compileClasspath += sourceSets.testDriver.output
sourceSets.test.runtimeClasspath += sourceSets.testDriver.output
ext.testDriverLoader = 'neoforge'
tasks.register('testDriverUnmappedJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar)
apply from: rootProject.file('scripts/test-driver.gradle')
sourceSets.testDriver.java.exclude { element ->
    def path = element.file.path.replace('\\', '/')
    (path.contains('/shared/src/testDriver1201/') &&
            element.file.name in ['ChanceOutputFixture.java', 'ChanceOutputScenario.java']) ||
    (path.contains('/shared/src/testDriver1201/') &&
            element.file.name in ['CraftPlanScenario.java', 'StandardCraftFixture.java', 'DriverScreenshots.java', 'ChatComponentAccessor.java', 'TestDriverRuntime.java', 'UiObservationStore.java', 'NoSpaceScenario.java', 'NoProviderScenario.java', 'NoPowerScenario.java', 'DispatchStatusFixture.java', 'NativeCpuFixture.java', 'WirelessTerminalFixture.java', 'Ae2ImportExportCardFixture.java', 'AeInfinityBoosterFixture.java', 'Ae2NetworkAnalyserFixture.java', 'ExtendedAeFixture.java', 'InteractiveMcpServer.java', 'AppliedBotanicsFixture.java', 'Ae2ThingsFixture.java', 'MegaCellsFixture.java', 'MeRequesterFixture.java', 'GuiGraphicsMixin.java', 'AbstractTableRendererMixin.java', 'CraftingStatusTableRendererObservationMixin.java', 'AEBaseScreenMixin.java', 'AEKeyRenderingMixin.java', 'RenderSystemMixin.java', 'MEStorageScreenAccessor.java', 'CPUSelectionListObservationMixin.java']) ||
            (path.contains('/shared/src/testDriverAddons/') && element.file.name == 'AdvancedAeStatusFixture.java')
}
sourceSets.testDriver.resources.setSrcDirs(['src/testDriver/resources'])

dependencies {
    testDriverCompileOnly 'maven.modrinth:692GClaE:EkohPYvX'
    testDriverCompileOnly 'maven.modrinth:ArHeh5Fz:3kMh6U7h'
    testDriverCompileOnly 'maven.modrinth:JiOqfoFM:KpNzac5y'
    testDriverCompileOnly 'maven.modrinth:oMgZ004U:yrw1WDVE'
    testDriverCompileOnly 'maven.modrinth:pNabrMMw:ncEqrp7o'
    testDriverCompileOnly 'maven.modrinth:qPydPwtX:lNUOSgAt'
    testDriverCompileOnly 'maven.modrinth:rvaW4C93:SKmbCuk9'
    testDriverCompileOnly 'maven.modrinth:RYE1pYyr:wv0rLPsF'
}

tasks.named('compileTestDriverJava', JavaCompile) { options.compilerArgs += ['-proc:none', '-Xlint:deprecation'] }
tasks.named('processTestDriverResources', ProcessResources) {
    def driverVersion = project.version
    inputs.property 'version', driverVersion
    filesMatching('META-INF/neoforge.mods.toml') { expand version: driverVersion }
}
tasks.register('testDriverJar', Copy) {
    dependsOn tasks.named('testDriverUnmappedJar')
    from tasks.named('testDriverUnmappedJar').flatMap { it.archiveFile }
    into rootProject.layout.buildDirectory.dir('test-driver')
}
tasks.register('checkTestDriverArtifacts') {
    group = 'verification'
    dependsOn tasks.named('jar'), tasks.named('testDriverJar')
    doLast {
        def production = tasks.named('jar').get().archiveFile.get().asFile
        def driver = tasks.named('testDriverUnmappedJar').get().archiveFile.get().asFile
        def productionEntries = zipTree(production).files.collect { it.path.replace('\\', '/') }
        def driverEntries = zipTree(driver).files.collect { it.path.replace('\\', '/') }
        if (productionEntries.any { it.contains('testdriver/') || it.contains('ae2craftingtime_test_driver') }
                || driverEntries.any { it.contains('/mc1201/Ae2CraftingTime.class') }
                || !driverEntries.any { it.endsWith('/testdriver/TestDriverMod.class') }
                || !driverEntries.any { it.endsWith('/META-INF/neoforge.mods.toml') }) {
            throw new GradleException('Invalid isolated NeoForge test-driver artifact')
        }
    }
}
tasks.named('test') { dependsOn tasks.named('checkTestDriverArtifacts') }
