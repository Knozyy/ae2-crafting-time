plugins {
    id 'com.gradleup.shadow' version '8.3.8'
    id 'net.neoforged.moddev' version '2.0.141'
}

base {
    archivesName = 'ae2-crafting-time-1.21.1-NeoForge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

def runtimeRunDirectory = providers.gradleProperty('runtimeRunDirectory').getOrElse('run-dev')

neoForge {
    version = providers.gradleProperty('runtimeNeoForge1211Version').getOrElse('21.1.1')

    runs {
        client {
            client()
            jvmArgument '-Xmx8G'
            ['scenario', 'profile', 'world', 'output', 'interactive', 'advancedStatus'].each { name ->
                def property = providers.gradleProperty("testDriver${name.capitalize()}")
                if (property.isPresent()) jvmArgument "-Dae2craftingtime.test.${name}=${property.get()}"
            }
            if (providers.gradleProperty('testDriverWorld').isPresent()) {
                programArgument '--quickPlaySingleplayer'
                programArgument providers.gradleProperty('testDriverWorld').get()
            }
        }
        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            gameDirectory = project.file(runtimeRunDirectory)
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        ae2craftingtime {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.java.srcDir '../../shared/src/main/java'
sourceSets.main.java.srcDir '../../shared/src/mcCommon/java'
sourceSets.main.java.srcDir '../../shared/src/neoforge/java'
sourceSets.main.java.srcDir '../../shared/src/mc1201/java'
// The Searge-remapped chat mixin twin cannot be annotation-processed by this
// toolchain (vanilla targets are official-named here); the 1.21.1 mixin
// config lists the remap=false ChatScreenMixin instead.
sourceSets.main.java.exclude '**/mixin/ChatScreenMixinSrg.java'
sourceSets.main.java.exclude '**/mixin/ChatTtcSymbolsMixinSrg.java'
sourceSets.main.java.exclude '**/mixin/AbstractContainerScreenCpuTtcMixinSrg.java'
sourceSets.main.java.exclude '**/mixin/CraftConfirmMenuMixinSrg.java'
sourceSets.main.resources.srcDir '../../shared/src/main/resources'
sourceSets.test.java.srcDir '../../shared/src/mc1201Test/java'

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modmaven'
        url = 'https://modmaven.dev/'
        content { includeGroup 'appeng' }
    }
}

dependencies {
    def ae2Group = providers.gradleProperty('runtimeAe2NeoForge1211Group').getOrElse('appeng')
    implementation "${ae2Group}:appliedenergistics2:${providers.gradleProperty('runtimeAe2NeoForge1211Version').getOrElse('19.0.24')}"
    compileOnly 'org.appliedenergistics:guideme:21.1.0'
    compileOnly 'maven.modrinth:jei:w1zqfWJi'
    testRuntimeOnly 'maven.modrinth:jei:w1zqfWJi'
    if (!providers.gradleProperty('runtimeLatestNeoForge1211').isPresent()) {
        runtimeOnly 'org.appliedenergistics:guideme:21.1.0'
    }
    compileOnly 'curse.maven:advancedae-1084104:7849217'
    compileOnly 'maven.modrinth:qelfSMnn:UNYpf7A1'
    compileOnly 'curse.maven:ae2-network-analyser-961856:7622554'
    compileOnly 'maven.modrinth:VQhDBNs8:qpbQk2Iq'
    compileOnly 'maven.modrinth:545hUrw9:leZwUP1X'
    compileOnly 'maven.modrinth:SOw6jD6x:Awt8eCuo'
    compileOnly 'curse.maven:ae2-things-forge-609977:5637783'
    compileOnly 'maven.modrinth:ayN3DZKb:Iw2gl7Lb'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            mod_id                 : 'ae2craftingtime',
            mod_name               : 'AE2 Crafting Time',
            mod_version            : project.version,
            mod_license            : 'MIT',
            mod_authors            : 'ctux',
            mod_description        : 'Shows when AE2 autocrafting should finish and helps you spot delays and bottlenecks.',
            minecraft_version_range: '[1.21.1]',
            neoforge_version_range : '[21.1.1,)',
            loader_version_range   : '[1,)'
    ]

    inputs.properties props

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'ae2craftingtime',
                'Specification-Vendor'    : 'ctux',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'ctux',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def distModVersion = project.version.toString()

tasks.register('distMod', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into rootProject.layout.projectDirectory.dir('dist')
    rename { "ae2-crafting-time-${distModVersion}-neoforge-1.21.1.jar" }
}

// Separate companion: never add driver sources or libraries to the player mod.
sourceSets { testDriver }
sourceSets.testDriver.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.testDriver.runtimeClasspath += sourceSets.testDriver.output + sourceSets.testDriver.compileClasspath
ext.testDriverLoader = 'neoforge'
tasks.register('testDriverUnmappedJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar)
apply from: rootProject.file('scripts/test-driver.gradle')
sourceSets.testDriver.java.exclude { element ->
    element.file.path.replace('\\', '/').contains('/shared/src/testDriver1201/') &&
            element.file.name in ['AppliedBotanicsFixture.java', 'Ae2ThingsFixture.java']
}
sourceSets.testDriver.resources.setSrcDirs(['src/testDriver/resources'])
dependencies {
    testDriverCompileOnly 'maven.modrinth:692GClaE:jH6bsw4F'
    testDriverCompileOnly 'maven.modrinth:B1CBVXHX:bpcbGDy4'
    testDriverCompileOnly 'maven.modrinth:gu7yAYhd:1ewzHZYg'
    testDriverCompileOnly 'maven.modrinth:ArHeh5Fz:RSF7tEIt'
    testDriverCompileOnly 'maven.modrinth:Ce6I4WUE:5KzzycBT'
    testDriverCompileOnly 'maven.modrinth:E6BFl96N:Zf5HhnF1'
    testDriverCompileOnly 'maven.modrinth:IiATswDj:TpUCzFaW'
    testDriverCompileOnly 'maven.modrinth:IZPmgTLT:nd0U5eJF'
    testDriverCompileOnly 'maven.modrinth:jjuIRIVr:RPG4EriK'
    testDriverCompileOnly 'maven.modrinth:M5jhzZXH:3xQLbgab'
    testDriverCompileOnly 'maven.modrinth:oMgZ004U:4x40hq9D'
    testDriverCompileOnly 'maven.modrinth:pNabrMMw:CxSEpEnO'
    testDriverCompileOnly 'maven.modrinth:qPydPwtX:kKLZdIPS'
    testDriverCompileOnly 'maven.modrinth:rvaW4C93:7JwMBNfy'
    testDriverCompileOnly 'maven.modrinth:rxYaglEe:ablTMAjP'
    testDriverCompileOnly 'maven.modrinth:RYE1pYyr:k444ySGT'
    testDriverCompileOnly 'maven.modrinth:SOw6jD6x:Awt8eCuo'
    testDriverCompileOnly 'maven.modrinth:SyKS54UY:me5XWMw9'
    testDriverCompileOnly 'maven.modrinth:udZtKfzP:gWMhHBje'
    testDriverCompileOnly 'curse.maven:omnisequence-1624558:8622739'
    testDriverCompileOnly 'curse.maven:projecte-226410:6611984'
}

tasks.named('compileTestDriverJava', JavaCompile) { options.compilerArgs += ['-proc:none'] }
tasks.named('processTestDriverResources', ProcessResources) {
    def driverVersion = project.version
    inputs.property 'version', driverVersion
    filesMatching('META-INF/neoforge.mods.toml') { expand version: driverVersion }
}
tasks.register('testDriverJar', Copy) {
    dependsOn tasks.named('testDriverUnmappedJar')
    from tasks.named('testDriverUnmappedJar').flatMap { it.archiveFile }
    into rootProject.layout.buildDirectory.dir('test-driver')
}
tasks.register('checkTestDriverArtifacts') {
    group = 'verification'
    dependsOn tasks.named('jar'), tasks.named('testDriverJar')
    doLast {
        def production = tasks.named('jar').get().archiveFile.get().asFile
        def driver = tasks.named('testDriverUnmappedJar').get().archiveFile.get().asFile
        def productionEntries = zipTree(production).files.collect { it.path.replace('\\', '/') }
        def driverEntries = zipTree(driver).files.collect { it.path.replace('\\', '/') }
        def driverMixins = new groovy.json.JsonSlurper().parseText(
                zipTree(driver).matching { include 'ae2craftingtime_test_driver.mixins.json' }.singleFile.text)
        if (productionEntries.any { it.contains('testdriver/') || it.contains('ae2craftingtime_test_driver') }
                || driverEntries.any { it.contains('/mc1201/Ae2CraftingTime.class') }
                || !driverEntries.any { it.endsWith('/testdriver/TestDriverMod.class') }
                || !driverEntries.any { it.endsWith('/META-INF/neoforge.mods.toml') }
                || !driverMixins.mixins.contains('CraftingCPUMenuAccessor')
                || !driverMixins.client.contains('CpuTtcClientMixin')
                || !driverMixins.client.contains('CpuTtcRequestsMixin')
                || !driverMixins.client.contains('CPUSelectionListObservationMixin')) {
            throw new GradleException('Invalid isolated NeoForge test-driver artifact')
        }
    }
}
tasks.named('test') { dependsOn tasks.named('checkTestDriverArtifacts') }

sourceSets.testDriver.java.srcDir '../../shared/src/testDriverAddons/java'
