plugins {
    id 'fabric-loom' version '1.10.5'
    id 'com.gradleup.shadow' version '8.3.8'
}

base {
    archivesName = 'ae2-crafting-time-1.20.1-Fabric'
}

def runtimeRunDirectory = project.relativePath(providers.gradleProperty('runtimeRunDirectory').getOrElse('run-dev'))

loom {
    runs {
        client {
            runDir runtimeRunDirectory
            vmArg '-Xmx8G'
            // Match production order; dev shuffling can initialize ExtendedAE before AE2WTLib.
            vmArg '-Dfabric.debug.disableModShuffle=true'
            ['scenario', 'profile', 'world', 'output', 'interactive'].each { name ->
                def property = providers.gradleProperty("testDriver${name.capitalize()}")
                if (property.isPresent()) vmArg "-Dae2craftingtime.test.${name}=${property.get()}"
            }
            if (providers.gradleProperty('testDriverWorld').isPresent()) {
                programArg '--quickPlaySingleplayer'
                programArg providers.gradleProperty('testDriverWorld').get()
            }
        }
        server { runDir runtimeRunDirectory }
    }
    mixin {
        defaultRefmapName = 'ae2craftingtime.refmap.json'
    }
}

sourceSets.main.java.srcDir '../../shared/src/main/java'
sourceSets.main.java.srcDir '../../shared/src/mcCommon/java'
sourceSets.main.java.srcDir '../../shared/src/mc1201/java'
sourceSets.main.resources.srcDir '../../shared/src/main/resources'
sourceSets.main.resources.srcDir '../../shared/src/mc1201/resources'
sourceSets.test.java.srcDir '../../shared/src/mc1201Test/java'

repositories {
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name = 'Modmaven'
        url = 'https://modmaven.dev/'
        content { includeGroup 'appeng' }
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${providers.gradleProperty('runtimeFabricLoader1201Version').getOrElse('0.14.21')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${providers.gradleProperty('runtimeFabricApi1201Version').getOrElse('0.83.1+1.20.1')}"
    modImplementation "appeng:appliedenergistics2-fabric:${providers.gradleProperty('runtimeAe2Fabric1201Version').getOrElse('15.0.10')}"
    modImplementation 'teamreborn:energy:3.0.0'
    // Bundle MixinExtras because the supported Fabric Loader floor predates its built-in copy.
    include(modImplementation(annotationProcessor('io.github.llamalad7:mixinextras-fabric:0.5.5')))
    modCompileOnly 'curse.maven:ae2-network-analyser-961856:5266839'
    modCompileOnly 'maven.modrinth:545hUrw9:j9qN58Hl'
    modCompileOnly 'maven.modrinth:veunMwU3:SKanB27c'
    modCompileOnly 'com.terraformersmc:modmenu:7.2.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

test {
    useJUnitPlatform()
}

def distModVersion = project.version.toString()

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', distModVersion

    from('../../shared/src/main/resources/assets/ae2craftingtime/guides/ae2craftingtime/guide') {
        into 'assets/ae2craftingtime/ae2guide'
    }

    filesMatching('fabric.mod.json') {
        expand version: distModVersion
    }
}

tasks.register('distMod', Copy) {
    dependsOn tasks.named('remapJar')
    from tasks.named('remapJar').flatMap { it.archiveFile }
    into rootProject.layout.projectDirectory.dir('dist')
    rename { "ae2-crafting-time-${distModVersion}-fabric-1.20.1.jar" }
}

// The companion uses the same mapped Minecraft/AE2 classes without joining main.
sourceSets { testDriver }
loom {
    createRemapConfigurations(sourceSets.testDriver)
    mixin {
        add sourceSets.main, 'ae2craftingtime.refmap.json'
        // Loom 1.10 also inspects unit-test compiler outputs while remapping.
        add sourceSets.test, 'ae2craftingtime_test.refmap.json'
        add sourceSets.testDriver, 'ae2craftingtime_test_driver.refmap.json'
    }
}
sourceSets.testDriver.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.testDriver.runtimeClasspath += sourceSets.testDriver.output + sourceSets.testDriver.compileClasspath
configurations.testDriverAnnotationProcessor.extendsFrom configurations.annotationProcessor
ext.testDriverLoader = 'fabric'
tasks.register('testDriverUnmappedJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar)
apply from: rootProject.file('scripts/test-driver.gradle')

dependencies {
    modTestDriverCompileOnly 'maven.modrinth:merequester:1.20.1-1.1.4+fabric'
    modTestDriverCompileOnly 'maven.modrinth:jjuIRIVr:NINqmdmJ'
}

tasks.named('processTestDriverResources', ProcessResources) {
    def driverVersion = project.version
    inputs.property 'version', driverVersion
    filesMatching('fabric.mod.json') { expand version: driverVersion }
}

def remapTestDriverJar = tasks.register('testDriverJar', net.fabricmc.loom.task.RemapJarTask) {
    group = 'build'
    description = 'Builds the isolated Fabric 1.20.1 UI test-driver mod.'
    dependsOn tasks.named('testDriverUnmappedJar')
    inputFile = tasks.named('testDriverUnmappedJar').flatMap { it.archiveFile }
    archiveFileName = "ae2-crafting-time-${project.version}-fabric-1.20.1-test-driver.jar"
    destinationDirectory = rootProject.layout.buildDirectory.dir('test-driver')
    addNestedDependencies = false
}

tasks.register('checkTestDriverArtifacts') {
    group = 'verification'
    dependsOn tasks.named('remapJar'), remapTestDriverJar
    doLast {
        def production = tasks.named('remapJar').get().archiveFile.get().asFile
        def driver = remapTestDriverJar.get().archiveFile.get().asFile
        [production: 'ae2craftingtime.refmap.json', driver: 'ae2craftingtime_test_driver.refmap.json'].each { name, refmap ->
            def artifact = name == 'production' ? production : driver
            def mappings = zipTree(artifact).matching { include refmap }.singleFile
            def parsedMappings = new groovy.json.JsonSlurper().parse(mappings).mappings
            if (!parsedMappings) {
                throw new GradleException("Missing mixin mappings in ${artifact}")
            }
            def cpuListMixin = name == 'production'
                    ? 'com/ctux/ae2craftingtime/mc1201/mixin/CPUSelectionListMixin'
                    : 'com/ctux/ae2craftingtime/testdriver/mixin/CPUSelectionListObservationMixin'
            def getCpuName = 'Lappeng/client/gui/widgets/CPUSelectionList;getCpuName(Lappeng/menu/me/crafting/CraftingStatusMenu$CraftingCpuListEntry;)Lnet/minecraft/network/chat/Component;'
            if (!parsedMappings[cpuListMixin]?.get(getCpuName)?.endsWith('Lnet/minecraft/class_2561;')) {
                throw new GradleException("${name} CPU list invocation descriptor is not remapped for Fabric: ${artifact}")
            }
            if (name == 'driver') {
                def observer = parsedMappings['com/ctux/ae2craftingtime/testdriver/mixin/StatsNetworkObservationMixin']
                def serverSend = 'Lnet/fabricmc/fabric/api/networking/v1/ServerPlayNetworking;send(Lnet/minecraft/server/level/ServerPlayer;Lnet/minecraft/resources/ResourceLocation;Lnet/minecraft/network/FriendlyByteBuf;)V'
                def clientSend = 'Lnet/fabricmc/fabric/api/client/networking/v1/ClientPlayNetworking;send(Lnet/minecraft/resources/ResourceLocation;Lnet/minecraft/network/FriendlyByteBuf;)V'
                if (!observer?.get(serverSend)?.contains('Lnet/minecraft/class_3222;')
                        || !observer?.get(clientSend)?.contains('Lnet/minecraft/class_2540;')) {
                    throw new GradleException("Connection observer send descriptors are not remapped for Fabric: ${artifact}")
                }
            }
        }
        def productionEntries = zipTree(production).files.collect { it.path.replace('\\', '/') }
        def driverEntries = zipTree(driver).files.collect { it.path.replace('\\', '/') }
        if (productionEntries.any { it.contains('testdriver/') || it.contains('ae2craftingtime_test_driver') }) {
            throw new GradleException("Production JAR contains test-driver content: ${production}")
        }
        if (driverEntries.any { it.contains('/mc1201/Ae2CraftingTime.class') }
                || !driverEntries.any { it.endsWith('/testdriver/TestDriverMod.class') }
                || !driverEntries.any { it.endsWith('/fabric.mod.json') }
                || !driverEntries.any { it.endsWith('/ae2craftingtime_test_driver.refmap.json') }) {
            throw new GradleException("Invalid test-driver artifact: ${driver}")
        }
    }
}
tasks.named('test') { dependsOn tasks.named('checkTestDriverArtifacts') }
