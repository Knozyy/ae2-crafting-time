test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('compileJava')
    from layout.buildDirectory.file('mixin/ae2craftingtime.refmap.json')
    def props = [
            mod_id                 : 'ae2craftingtime',
            mod_name               : 'AE2 Crafting Time',
            mod_version            : project.version,
            mod_license            : 'MIT',
            mod_authors            : 'ctux',
            mod_description        : 'Shows when AE2 autocrafting should finish and helps you spot delays and bottlenecks.',
            minecraft_version_range: '[1.20.1,1.21)',
            forge_version_range    : '[47.1.3,)',
            loader_version_range   : '[47,)'
    ]

    inputs.properties props

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.named('processTestDriverResources', ProcessResources).configure {
    def props = [
            mod_version            : project.version,
            minecraft_version_range: '[1.20.1,1.21)',
            forge_version_range    : '[47.1.3,)',
            loader_version_range   : '[47,)'
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    filesMatching('ae2craftingtime.refmap.json') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
    manifest {
        attributes([
                'Specification-Title'     : 'ae2craftingtime',
                'Specification-Vendor'    : 'ctux',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'ctux',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'ae2craftingtime.mixins.json,ae2craftingtime-advancedae.mixins.json,ae2craftingtime-suspension.mixins.json'
        ])
    }
}

def distModVersion = project.version.toString()

tasks.register('distMod', Copy) {
    dependsOn tasks.named('reobfJar')
    from tasks.named('reobfJar')
    into rootProject.layout.projectDirectory.dir('dist')
    rename { "ae2-crafting-time-${distModVersion}-forge-1.20.1.jar" }
}

def testDriverFileName = "ae2-crafting-time-${project.version}-forge-1.20.1-test-driver.jar"
ext.testDriverLoader = 'forge'
tasks.register('testDriverUnmappedJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar)
apply from: rootProject.file('scripts/test-driver.gradle')
sourceSets.test.compileClasspath += configurations.testDriverLibraries
sourceSets.test.runtimeClasspath += configurations.testDriverLibraries
def testDriverUnmappedJar = tasks.named('testDriverUnmappedJar')
testDriverUnmappedJar.configure {
    from layout.buildDirectory.file('mixin/ae2craftingtime_test_driver.refmap.json')
}

def reobfTestDriverJar = obfuscation.reobfuscate(testDriverUnmappedJar, sourceSets.testDriver) {
    archiveFileName = testDriverFileName
    destinationDirectory = rootProject.layout.buildDirectory.dir('test-driver')
}

tasks.named('reobfJar') {
    dependsOn tasks.named('compileTestDriverJava')
}

tasks.named('testDriverJar') {
    group = 'build'
    description = 'Builds the isolated Forge 1.20.1 UI test-driver mod.'
    dependsOn reobfTestDriverJar
}

tasks.register('checkTestDriverArtifacts') {
    group = 'verification'
    dependsOn tasks.named('reobfJar'), reobfTestDriverJar
    doLast {
        def production = tasks.named('reobfJar').get().archiveFile.get().asFile
        def driver = reobfTestDriverJar.get().archiveFile.get().asFile
        [zipTree(production).matching { include 'ae2craftingtime.refmap.json' }.singleFile,
         layout.buildDirectory.file('resources/main/ae2craftingtime.refmap.json').get().asFile].each { refmap ->
            if (!new groovy.json.JsonSlurper().parse(refmap).mappings) {
                throw new GradleException("Missing production mixin mappings: ${refmap}")
            }
        }
        def productionEntries = zipTree(production).files.collect { it.path.replace('\\', '/') }
        def driverEntries = zipTree(driver).files.collect { it.path.replace('\\', '/') }
        def forbiddenProduction = ['testdriver/', 'ae2craftingtime_test_driver', 'modelcontextprotocol']
        if (productionEntries.any { entry -> forbiddenProduction.any { entry.contains(it) } }) {
            throw new GradleException("Production JAR contains test-driver content: ${production}")
        }
        if (driverEntries.any { it.contains('/mc1201/Ae2CraftingTime.class') }) {
            throw new GradleException("Test-driver JAR embeds production classes: ${driver}")
        }
        if (!driverEntries.any { it.endsWith('/testdriver/TestDriverMod.class') }
                || !driverEntries.any { it.endsWith('META-INF/mods.toml') }) {
            throw new GradleException("Test-driver JAR is incomplete: ${driver}")
        }
    }
}

tasks.named('test') {
    dependsOn tasks.named('checkTestDriverArtifacts')
    def driverJar = testDriverUnmappedJar.flatMap { it.archiveFile }
    inputs.file(driverJar)
    systemProperty 'ae2craftingtime.test.driverJar', driverJar.get().asFile.absolutePath
}

sourceSets.testDriver.java.srcDir '../../shared/src/testDriverAddons/java'

tasks.named('testDriverUnmappedJar') {
    manifest.attributes 'MixinConfigs': 'ae2craftingtime_test_driver.mixins.json,ae2craftingtime_test_driver_neoeco.mixins.json'
}

def coveredTestDriverClasses = sourceSets.testDriver.output.classesDirs.asFileTree.matching {
    include 'com/ctux/ae2craftingtime/testdriver/RecurrentPlanFixture.class'
    include 'com/ctux/ae2craftingtime/testdriver/StandardAe2Scenario.class'
    include 'com/ctux/ae2craftingtime/testdriver/UiObservationStore.class'
    include 'com/ctux/ae2craftingtime/testdriver/UiSnapshot.class'
    include 'com/ctux/ae2craftingtime/testdriver/CraftPlanScenario$BlockTerminalReadiness.class'
    include 'com/ctux/ae2craftingtime/testdriver/SortObservation.class'
    include 'com/ctux/ae2craftingtime/testdriver/ResourcePrewarmControl.class'
    include 'com/ctux/ae2craftingtime/testdriver/ResourceFixtureControl.class'
}
tasks.named('jacocoTestReport', JacocoReport).configure {
    classDirectories.from(coveredTestDriverClasses)
}
tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification).configure {
    classDirectories.from(coveredTestDriverClasses)
    violationRules.rule {
        element = 'METHOD'
        includes = ['com.ctux.ae2craftingtime.testdriver.UiSnapshot.matchingRenderedText*',
                    'com.ctux.ae2craftingtime.testdriver.UiSnapshot.lambda$matchingRenderedText*',
                    'com.ctux.ae2craftingtime.testdriver.UiSnapshot.nativeStatusTitle*']
        limit { counter = 'LINE'; minimum = 1.0 }
        limit { counter = 'BRANCH'; minimum = 1.0 }
    }
    violationRules.rule {
        element = 'METHOD'
        includes = ['com.ctux.ae2craftingtime.testdriver.StandardAe2Scenario.suspensionPausedJobReady*',
                    'com.ctux.ae2craftingtime.testdriver.StandardAe2Scenario.acknowledgeStaleSuspension*',
                    'com.ctux.ae2craftingtime.testdriver.StandardAe2Scenario.validateSuspension*',
                    'com.ctux.ae2craftingtime.testdriver.StandardAe2Scenario.focusNativeWindow*',
                    'com.ctux.ae2craftingtime.testdriver.StandardAe2Scenario.galleryPlanReady*',
                    'com.ctux.ae2craftingtime.testdriver.StandardAe2Scenario.lambda$galleryPlanReady*',
                    'com.ctux.ae2craftingtime.testdriver.StandardAe2Scenario.galleryAccuracyReady*']
        limit { counter = 'LINE'; minimum = 1.0 }
        limit { counter = 'BRANCH'; minimum = 1.0 }
    }
    violationRules.rule {
        element = 'METHOD'
        includes = ['hasPlate', 'hasEdge', 'plateOutputsAt', 'renderOutputsAt', 'hasBeam'].collectMany { name ->
            ['com.ctux.ae2craftingtime.testdriver.StandardAe2Scenario.' + name + '*',
             'com.ctux.ae2craftingtime.testdriver.StandardAe2Scenario.lambda$' + name + '*']
        }
        limit { counter = 'LINE'; minimum = 1.0 }
        limit { counter = 'BRANCH'; minimum = 1.0 }
    }
    violationRules.rule {
        element = 'METHOD'
        includes = ['com.ctux.ae2craftingtime.testdriver.RecurrentPlanFixture.enableDetection*',
                    'com.ctux.ae2craftingtime.testdriver.RecurrentPlanFixture.restoreDetection*']
        limit { counter = 'LINE'; minimum = 1.0 }
        limit { counter = 'BRANCH'; minimum = 1.0 }
    }
    violationRules.rule {
        element = 'METHOD'
        includes = ['com.ctux.ae2craftingtime.testdriver.UiObservationStore.semanticText*',
                    'com.ctux.ae2craftingtime.testdriver.UiObservationStore.planDescription*',
                    'com.ctux.ae2craftingtime.testdriver.UiObservationStore.planTotalText*',
                    'com.ctux.ae2craftingtime.testdriver.StandardAe2Scenario.recurrentBadgeMatches*']
        limit { counter = 'LINE'; minimum = 1.0 }
        limit { counter = 'BRANCH'; minimum = 1.0 }
    }
    violationRules.rule {
        element = 'METHOD'
        includes = ['com.ctux.ae2craftingtime.testdriver.ResourceFixtureControl.reconnectReady*']
        limit { counter = 'LINE'; minimum = 1.0 }
        limit { counter = 'BRANCH'; minimum = 1.0 }
    }
    violationRules.rule {
        element = 'CLASS'
        includes = ['com.ctux.ae2craftingtime.testdriver.ResourcePrewarmControl']
        limit { counter = 'LINE'; minimum = 1.0 }
        limit { counter = 'BRANCH'; minimum = 1.0 }
    }
    violationRules.rule {
        element = 'CLASS'
        includes = ['com.ctux.ae2craftingtime.testdriver.CraftPlanScenario$BlockTerminalReadiness']
        limit {
            counter = 'LINE'
            minimum = 1.0
        }
        limit {
            counter = 'BRANCH'
            minimum = 1.0
        }
    }
    violationRules.rule {
        element = 'CLASS'
        includes = ['com.ctux.ae2craftingtime.testdriver.SortObservation']
        limit {
            counter = 'LINE'
            minimum = 1.0
        }
        limit {
            counter = 'BRANCH'
            minimum = 1.0
        }
    }
}
